<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="red-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="border-glow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#fda4af"/>
    </linearGradient>
  </defs>

  <!-- Dark Crimson Squircle Canvas -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#180208" stroke="url(#border-glow)" stroke-width="3.5"/>

  <!-- Microchip CPU Pins in Red -->
  <!-- Top Pins -->
  <path d="M24 14v6 M32 14v6 M40 14v6" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
  <!-- Bottom Pins -->
  <path d="M24 44v6 M32 44v6 M40 44v6" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
  <!-- Left Pins -->
  <path d="M14 24h6 M14 32h6 M14 40h6" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
  <!-- Right Pins -->
  <path d="M44 24h6 M44 32h6 M44 40h6" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>

  <!-- Outer Chip Outline -->
  <rect x="20" y="20" width="24" height="24" rx="4" stroke="url(#red-gradient)" stroke-width="3.5" fill="#2d0612"/>

  <!-- Checkmark in White -->
  <path d="M27 32l3.5 3.5 7-7" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
