<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="glow-border" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="45%" stop-color="#0055ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>
  </defs>

  <!-- Dark Squircle Canvas -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#030712" stroke="url(#glow-border)" stroke-width="3.5"/>

  <!-- Microchip CPU Pins -->
  <!-- Top Pins -->
  <path d="M24 16v5 M32 16v5 M40 16v5" stroke="#00e5ff" stroke-width="3" stroke-linecap="round"/>
  <!-- Bottom Pins -->
  <path d="M24 43v5 M32 43v5 M40 43v5" stroke="#00e5ff" stroke-width="3" stroke-linecap="round"/>
  <!-- Left Pins -->
  <path d="M16 24h5 M16 32h5 M16 40h5" stroke="#00e5ff" stroke-width="3" stroke-linecap="round"/>
  <!-- Right Pins -->
  <path d="M43 24h5 M43 32h5 M43 40h5" stroke="#00e5ff" stroke-width="3" stroke-linecap="round"/>

  <!-- Outer Chip Outline -->
  <rect x="21" y="21" width="22" height="22" rx="3" stroke="#00e5ff" stroke-width="3.5" fill="none"/>

  <!-- Inner Chip Core -->
  <rect x="28" y="28" width="8" height="8" rx="1.5" stroke="#00e5ff" stroke-width="3" fill="none"/>
</svg>
